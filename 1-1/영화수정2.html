<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>나만의 영화 티어리스트</title>
    <style>
        /* 기본 스타일 및 넷플릭스 느낌의 다크 테마 */
        :root {
            --bg-color: #141414;
            --text-color: #ffffff;
            --card-bg: #2f2f2f;
            --primary-color: #e50914;
            --primary-hover: #f40612;
            --tier-s: #ff7f7f;
            --tier-a: #ffbf7f;
            --tier-b: #ffff7f;
            --tier-c: #7fff7f;
            --tier-d: #7fbfff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, 'Helvetica Neue', 'Segoe UI', 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif;
            padding: 20px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding-bottom: 10px;
            border-bottom: 1px solid #333;
        }

        h1 {
            font-size: 24px;
            font-weight: bold;
        }

        button {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: var(--primary-hover);
        }

        button.secondary {
            background-color: #555;
        }
        button.secondary:hover {
            background-color: #777;
        }

        /* 티어리스트 레이아웃 */
        .tier-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .tier-row {
            display: flex;
            background-color: #1f1f1f;
            border-radius: 8px;
            overflow: hidden;
            min-height: 180px;
        }

        .tier-label {
            width: 100px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
            font-weight: 900;
            color: #141414;
            flex-shrink: 0;
        }

        .tier-s .tier-label { background-color: var(--tier-s); }
        .tier-a .tier-label { background-color: var(--tier-a); }
        .tier-b .tier-label { background-color: var(--tier-b); }
        .tier-c .tier-label { background-color: var(--tier-c); }
        .tier-d .tier-label { background-color: var(--tier-d); }

        .movie-list {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            padding: 15px;
            width: 100%;
            align-items: flex-start;
        }

        /* 영화 카드 */
        .movie-card {
            width: 100px;
            height: 150px;
            background-color: var(--card-bg);
            border-radius: 4px;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            position: relative;
        }

        .movie-card:hover {
            transform: scale(1.05);
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            z-index: 10;
        }

        .movie-card.dragging {
            opacity: 0.5;
        }

        .movie-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .movie-card .no-image {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 10px;
            font-size: 12px;
            word-break: keep-all;
            background-color: #333;
        }

        /* 모달 (팝업) 공통 */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: rgba(0, 0, 0, 0.8);
            z-index: 100;
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background-color: #181818;
            padding: 30px;
            border-radius: 8px;
            width: 90%;
            max-width: 500px;
            position: relative;
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
        }

        .close-btn {
            position: absolute;
            top: 15px;
            right: 20px;
            font-size: 24px;
            cursor: pointer;
            color: #aaa;
        }

        .close-btn:hover {
            color: white;
        }

        /* 입력 폼 */
        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #ccc;
        }

        .form-group input, .form-group select, .form-group textarea {
            width: 100%;
            padding: 10px;
            background-color: #333;
            border: 1px solid #444;
            color: white;
            border-radius: 4px;
            font-family: inherit;
        }

        .form-group textarea {
            resize: vertical;
            height: 80px;
        }

        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 20px;
        }

        /* 상세 보기 모달 특화 */
        .detail-header {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
        }

        .detail-poster {
            width: 120px;
            height: 180px;
            background-color: #333;
            border-radius: 4px;
            object-fit: cover;
        }

        .detail-info h2 {
            margin-bottom: 10px;
            font-size: 22px;
        }

        .detail-info p {
            margin-bottom: 5px;
            color: #ccc;
            font-size: 14px;
        }

        .detail-review {
            background-color: #222;
            padding: 15px;
            border-radius: 4px;
            min-height: 80px;
            line-height: 1.5;
        }

        .star-rating {
            color: #f5c518;
            font-weight: bold;
            font-size: 16px;
        }
    </style>
</head>
<body>

    <header>
        <h1>🎬 나만의 영화 티어리스트</h1>
        <button onclick="openFormModal()">+ 카드 추가</button>
    </header>

    <main class="tier-container">
        <!-- 각 티어별 영역 -->
        <div class="tier-row tier-s" data-tier="S">
            <div class="tier-label">S</div>
            <div class="movie-list" id="list-S"></div>
        </div>
        <div class="tier-row tier-a" data-tier="A">
            <div class="tier-label">A</div>
            <div class="movie-list" id="list-A"></div>
        </div>
        <div class="tier-row tier-b" data-tier="B">
            <div class="tier-label">B</div>
            <div class="movie-list" id="list-B"></div>
        </div>
        <div class="tier-row tier-c" data-tier="C">
            <div class="tier-label">C</div>
            <div class="movie-list" id="list-C"></div>
        </div>
        <div class="tier-row tier-d" data-tier="D">
            <div class="tier-label">D</div>
            <div class="movie-list" id="list-D"></div>
        </div>
    </main>

    <!-- 영화 추가/수정 모달 -->
    <div class="modal-overlay" id="formModal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModals()">&times;</span>
            <h2 id="formTitle" style="margin-bottom: 20px;">영화 추가</h2>
            <form id="movieForm" onsubmit="saveMovie(event)">
                <input type="hidden" id="movieId">
                <div class="form-group">
                    <label for="title">영화 제목 *</label>
                    <input type="text" id="title" required placeholder="예: 인터스텔라">
                </div>
                <div class="form-group">
                    <label for="poster">포스터 이미지 URL</label>
                    <input type="url" id="poster" placeholder="http://... (비워두면 제목 표시)">
                </div>
                <div class="form-group">
                    <label for="genre">장르</label>
                    <input type="text" id="genre" placeholder="예: SF, 드라마">
                </div>
                <div class="form-group">
                    <label for="rating">별점 (티어 자동 배정) *</label>
                    <select id="rating" required>
                        <option value="5">⭐⭐⭐⭐⭐ 5점 (S 티어)</option>
                        <option value="4">⭐⭐⭐⭐ 4점 (A 티어)</option>
                        <option value="3">⭐⭐⭐ 3점 (B 티어)</option>
                        <option value="2">⭐⭐ 2점 (C 티어)</option>
                        <option value="1">⭐ 1점 (D 티어)</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="review">감상평</label>
                    <textarea id="review" placeholder="영화에 대한 감상을 자유롭게 적어주세요."></textarea>
                </div>
                <div class="modal-actions">
                    <button type="button" class="secondary" onclick="closeModals()">취소</button>
                    <button type="submit">저장</button>
                </div>
            </form>
        </div>
    </div>

    <!-- 영화 상세 보기 모달 -->
    <div class="modal-overlay" id="detailModal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModals()">&times;</span>
            <div class="detail-header">
                <img id="detailPoster" class="detail-poster" src="" alt="포스터">
                <div class="detail-info">
                    <h2 id="detailTitle">영화 제목</h2>
                    <p><strong>장르:</strong> <span id="detailGenre"></span></p>
                    <p><strong>티어:</strong> <span id="detailTier"></span></p>
                    <p><strong>별점:</strong> <span id="detailRating" class="star-rating"></span></p>
                </div>
            </div>
            <div class="form-group">
                <label>감상평</label>
                <div id="detailReview" class="detail-review"></div>
            </div>
            <div class="modal-actions">
                <button type="button" class="secondary" id="btnDelete">삭제</button>
                <button type="button" id="btnEdit">수정</button>
            </div>
        </div>
    </div>

    <script>
        // --- 1. 데이터 관리 ---
        const STORAGE_KEY = 'movieTierListData';
        let movies = [];

        // 샘플 데이터
        const sampleData = [
            { id: '1', title: '다크 나이트', poster: 'https://upload.wikimedia.org/wikipedia/ko/8/89/%EB%8B%A4%ED%81%AC_%EB%82%98%EC%9D%B4%ED%8A%B8_%ED%8F%AC%EC%8A%A4%ED%84%B0.jpg', genre: '액션/범죄', rating: 5, tier: 'S', review: '히어로 영화의 마스터피스.' },
            { id: '2', title: '인셉션', poster: 'https://upload.wikimedia.org/wikipedia/ko/9/91/%EC%9D%B8%EC%85%89%EC%85%98_%ED%8F%AC%EC%8A%A4%ED%84%B0.jpg', genre: 'SF/액션', rating: 5, tier: 'S', review: '꿈 속의 꿈, 완벽한 연출과 결말.' },
            { id: '3', title: '어벤져스', poster: 'https://upload.wikimedia.org/wikipedia/ko/f/f2/%EC%96%B4%EB%B2%A4%EC%A0%B8%EC%8A%A4_%ED%8F%AC%EC%8A%A4%ED%84%B0.jpg', genre: '액션/히어로', rating: 4, tier: 'A', review: '마블 시네마틱 유니버스의 성공적인 앙상블.' },
            { id: '4', title: '아바타', poster: 'https://upload.wikimedia.org/wikipedia/ko/c/c2/%EC%95%84%EB%B0%94%ED%83%80_%ED%8F%AC%EC%8A%A4%ED%84%B0.jpg', genre: 'SF/어드벤처', rating: 3, tier: 'B', review: '시각 효과는 훌륭하지만 스토리는 평범함.' }
        ];

        // 초기화 (로컬스토리지에서 불러오기)
        function init() {
            const storedData = localStorage.getItem(STORAGE_KEY);
            if (storedData) {
                movies = JSON.parse(storedData);
            } else {
                movies = [...sampleData];
                saveToStorage();
            }
            renderTiers();
            setupDragAndDrop();
        }

        function saveToStorage() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(movies));
        }

        // 별점 <-> 티어 변환 로직
        function getTierFromRating(rating) {
            const map = { 5: 'S', 4: 'A', 3: 'B', 2: 'C', 1: 'D' };
            return map[rating] || 'D';
        }

        function getRatingFromTier(tier) {
            const map = { 'S': 5, 'A': 4, 'B': 3, 'C': 2, 'D': 1 };
            return map[tier] || 1;
        }

        // --- 2. 화면 렌더링 ---
        function renderTiers() {
            // 모든 리스트 비우기
            ['S', 'A', 'B', 'C', 'D'].forEach(tier => {
                document.getElementById(`list-${tier}`).innerHTML = '';
            });

            // 영화 카드 생성 및 배치
            movies.forEach(movie => {
                const card = document.createElement('div');
                card.className = 'movie-card';
                card.draggable = true;
                card.dataset.id = movie.id;
                card.onclick = () => openDetailModal(movie.id);

                if (movie.poster) {
                    card.innerHTML = `<img src="${movie.poster}" alt="${movie.title}" onerror="this.outerHTML='<div class=\\'no-image\\'>${movie.title}</div>'">`;
                } else {
                    card.innerHTML = `<div class="no-image">${movie.title}</div>`;
                }

                document.getElementById(`list-${movie.tier}`).appendChild(card);
            });
        }

        // --- 3. 모달 제어 ---
        function closeModals() {
            document.getElementById('formModal').style.display = 'none';
            document.getElementById('detailModal').style.display = 'none';
            document.getElementById('movieForm').reset();
            document.getElementById('movieId').value = '';
        }

        function openFormModal(movieId = null) {
            closeModals();
            const modal = document.getElementById('formModal');
            const title = document.getElementById('formTitle');
            
            if (movieId) {
                title.innerText = '영화 정보 수정';
                const movie = movies.find(m => m.id === movieId);
                document.getElementById('movieId').value = movie.id;
                document.getElementById('title').value = movie.title;
                document.getElementById('poster').value = movie.poster || '';
                document.getElementById('genre').value = movie.genre || '';
                document.getElementById('rating').value = movie.rating;
                document.getElementById('review').value = movie.review || '';
            } else {
                title.innerText = '영화 추가';
            }
            
            modal.style.display = 'flex';
        }

        function openDetailModal(movieId) {
            const movie = movies.find(m => m.id === movieId);
            if (!movie) return;

            document.getElementById('detailTitle').innerText = movie.title;
            document.getElementById('detailGenre').innerText = movie.genre || '정보 없음';
            document.getElementById('detailTier').innerText = movie.tier;
            document.getElementById('detailRating').innerText = '⭐'.repeat(movie.rating);
            document.getElementById('detailReview').innerText = movie.review || '작성된 감상평이 없습니다.';
            
            const posterImg = document.getElementById('detailPoster');
            if (movie.poster) {
                posterImg.src = movie.poster;
                posterImg.style.display = 'block';
                posterImg.onerror = function() { this.src = 'https://via.placeholder.com/120x180/333/fff?text=No+Image'; };
            } else {
                posterImg.src = 'https://via.placeholder.com/120x180/333/fff?text=No+Image';
            }

            // 수정, 삭제 버튼 이벤트 연결
            document.getElementById('btnEdit').onclick = () => openFormModal(movie.id);
            document.getElementById('btnDelete').onclick = () => deleteMovie(movie.id);

            document.getElementById('detailModal').style.display = 'flex';
        }

        // --- 4. CRUD 로직 ---
        function saveMovie(event) {
            event.preventDefault();
            
            const id = document.getElementById('movieId').value;
            const rating = parseInt(document.getElementById('rating').value);
            
            const movieData = {
                title: document.getElementById('title').value,
                poster: document.getElementById('poster').value,
                genre: document.getElementById('genre').value,
                rating: rating,
                tier: getTierFromRating(rating),
                review: document.getElementById('review').value
            };

            if (id) {
                // 수정
                const index = movies.findIndex(m => m.id === id);
                movies[index] = { ...movies[index], ...movieData };
            } else {
                // 추가
                movieData.id = Date.now().toString(); // 고유 ID 생성
                movies.push(movieData);
            }

            saveToStorage();
            renderTiers();
            closeModals();
        }

        function deleteMovie(id) {
            if (confirm('정말로 이 영화를 삭제하시겠습니까?')) {
                movies = movies.filter(m => m.id !== id);
                saveToStorage();
                renderTiers();
                closeModals();
            }
        }

        // --- 5. 드래그 앤 드롭 로직 ---
        let draggedCardId = null;

        function setupDragAndDrop() {
            const tierContainers = document.querySelectorAll('.movie-list');

            // 이벤트 위임을 사용하여 동적으로 생성된 카드도 처리
            document.addEventListener('dragstart', e => {
                if (e.target.classList.contains('movie-card')) {
                    draggedCardId = e.target.dataset.id;
                    e.target.classList.add('dragging');
                }
            });

            document.addEventListener('dragend', e => {
                if (e.target.classList.contains('movie-card')) {
                    e.target.classList.remove('dragging');
                    draggedCardId = null;
                }
            });

            tierContainers.forEach(container => {
                container.addEventListener('dragover', e => {
                    e.preventDefault(); // 드롭 허용
                    const afterElement = getDragAfterElement(container, e.clientX);
                    const draggable = document.querySelector('.dragging');
                    if (draggable) {
                        if (afterElement == null) {
                            container.appendChild(draggable);
                        } else {
                            container.insertBefore(draggable, afterElement);
                        }
                    }
                });

                container.addEventListener('drop', e => {
                    e.preventDefault();
                    if (!draggedCardId) return;

                    const newTier = container.parentElement.dataset.tier;
                    const draggedMovieIndex = movies.findIndex(m => m.id === draggedCardId);
                    const movie = movies[draggedMovieIndex];

                    // 티어 및 별점 업데이트
                    if (movie.tier !== newTier) {
                        movie.tier = newTier;
                        movie.rating = getRatingFromTier(newTier);
                    }

                    // 배열 순서 재정렬 (DOM 순서 기반)
                    const currentDOMOrder = Array.from(container.querySelectorAll('.movie-card')).map(card => card.dataset.id);
                    
                    // 기존 배열에서 제거
                    movies.splice(draggedMovieIndex, 1);
                    
                    // 새 위치 찾아서 삽입
                    const newIndexInDOM = currentDOMOrder.indexOf(draggedCardId);
                    
                    // 같은 티어 내의 영화들만 추출
                    const sameTierMovies = movies.filter(m => m.tier === newTier);
                    
                    if (newIndexInDOM >= sameTierMovies.length) {
                        movies.push(movie); // 맨 끝에 추가
                    } else {
                        // 삽입할 위치의 다음 영화 ID를 찾음
                        const nextMovieId = currentDOMOrder[newIndexInDOM + 1];
                        if (nextMovieId) {
                            const insertIndex = movies.findIndex(m => m.id === nextMovieId);
                            movies.splice(insertIndex, 0, movie);
                        } else {
                            movies.push(movie);
                        }
                    }

                    saveToStorage();
                    // 드래그 종료 후 UI의 일관성을 위해 다시 렌더링
                    setTimeout(renderTiers, 10); 
                });
            });
        }

        // 마우스 X 좌표를 기준으로 삽입할 위치(어떤 카드 앞인지) 계산
        function getDragAfterElement(container, x) {
            const draggableElements = [...container.querySelectorAll('.movie-card:not(.dragging)')];

            return draggableElements.reduce((closest, child) => {
                const box = child.getBoundingClientRect();
                const offset = x - box.left - box.width / 2;
                if (offset < 0 && offset > closest.offset) {
                    return { offset: offset, element: child };
                } else {
                    return closest;
                }
            }, { offset: Number.NEGATIVE_INFINITY }).element;
        }

        // 앱 시작
        init();

    </script>
</body>
</html>
